# The production stack for one small server. Use it through deploy.sh in this
# folder (see server/README.md, Production):
#
#   ./deploy.sh init your.domain     write production.env with fresh secrets
#   ./deploy.sh install              build, start, migrate, import the content
#   ./deploy.sh update               after `git pull`: rebuild, migrate, restart
#   ./deploy.sh owner                create the studio owner (asks for a password)
#   ./deploy.sh backup               database + images into ./backups
#
# Two ways in from the internet:
#   - the server already runs a web server (nginx, Caddy...) for another site:
#     leave USE_CADDY=false and point it at 127.0.0.1:${APP_PORT}
#     (nginx.example.conf);
#   - nothing else on 80/443: USE_CADDY=true and the bundled Caddy takes
#     80/443 and gets the certificates itself (Caddyfile.example).
# PostgreSQL has no published port in either case - only the app reaches it,
# on the private network.
name: younes-tattoo-prod

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in production.env}
      YOUNES_MIGRATOR_PASSWORD: ${YOUNES_MIGRATOR_PASSWORD:?set in production.env}
      YOUNES_APP_PASSWORD: ${YOUNES_APP_PASSWORD:?set in production.env}
      YOUNES_DATABASES: younes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d younes"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
    restart: unless-stopped
    # no `ports:` - never publish PostgreSQL

  app:
    image: younes-tattoo:latest
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: runtime
    env_file: production.env
    environment:
      DATABASE_URL: postgres://younes_app:${YOUNES_APP_PASSWORD}@postgres:5432/younes
      MIGRATION_DATABASE_URL: postgres://younes_migrator:${YOUNES_MIGRATOR_PASSWORD}@postgres:5432/younes
      TRUST_PROXY: "true"
    # this machine only (for a web server already on it); never 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
    restart: unless-stopped

  # one-off jobs from the full checkout: importing the site's content
  tools:
    image: younes-tattoo-tools:latest
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: tools
    profiles: [tools]
    user: node
    env_file: production.env
    environment:
      DATABASE_URL: postgres://younes_app:${YOUNES_APP_PASSWORD}@postgres:5432/younes
      MIGRATION_DATABASE_URL: postgres://younes_migrator:${YOUNES_MIGRATOR_PASSWORD}@postgres:5432/younes
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2
    profiles: [caddy]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in production.env}
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [edge]
    restart: unless-stopped

networks:
  private:
    internal: true
  edge: {}

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
