# EXAMPLE for a server whose nginx already serves another site: this adds
# the studio's domain beside it. Copy to /etc/nginx/sites-available/younes,
# set the domain, link it into sites-enabled, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d younes.example     # HTTPS (adds the 443 block)
#
# The app listens on 127.0.0.1:APP_PORT (production.env, 3001 by default).
# If nginx itself runs in Docker, 127.0.0.1 is the nginx container - use the
# host's address instead (e.g. host.docker.internal with
# extra_hosts: ["host.docker.internal:host-gateway"]).
#
# Using Caddy for the other site instead? Add this to its Caddyfile:
#
#   younes.example {
#       encode zstd gzip
#       request_body { max_size 25MB }
#       reverse_proxy 127.0.0.1:3001
#   }

server {
    listen 80;
    listen [::]:80;
    server_name younes.example;

    # uploads are at most 20 MB (the API refuses more)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the app trusts these only because it's reachable from this machine alone
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
